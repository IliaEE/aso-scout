# NOTE: Railway deprecated Config as Code. Services created after 2026-08-28
# cannot opt in, so this file is IGNORED on new services and everything below
# must be set by hand in the service Settings UI:
#
#   Custom Start Command : python -m src.jobs.worker
#   Healthcheck Path     : /healthz
#   Restart Policy       : On Failure, max retries 5
#
# The file is kept only for older services that already use Config as Code,
# and as a record of the intended configuration.
#
# A volume is REQUIRED and is NOT created here. Use the Command Palette (Cmd+K)
# or right-click the project canvas -> Volume. Mount it at /data.
# Railway then sets RAILWAY_VOLUME_MOUNT_PATH automatically and the database
# follows it, so SQLITE_PATH does not need to be set by hand.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.jobs.worker"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
